<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:22px;fill:#667085}.h{font-size:22px;font-weight:700}.b{font-size:18px;fill:#475467}</style><text x="70" y="85" class="t">From Risk Profile to Intervention Consideration</text><text x="70" y="125" class="s">The submitted report translated subgroup-specific patterns into differentiated prevention considerations</text><rect x="70" y="190" width="500" height="135" rx="22" fill="#eff6ff" stroke="#93c5fd"/><text x="105" y="235" class="h">Older / low-energy / chronic-disease profile</text><text x="105" y="278" class="b">Nutrition support · disease management · social-support reinforcement</text><rect x="630" y="190" width="500" height="135" rx="22" fill="#f5f3ff" stroke="#c4b5fd"/><text x="665" y="235" class="h">Younger / unmarried / sedentary profile</text><text x="665" y="278" class="b">Lifestyle balance · nutrition · social-support considerations</text><rect x="70" y="365" width="500" height="135" rx="22" fill="#ecfdf3" stroke="#86efac"/><text x="105" y="410" class="h">Fine-dust-exposed profile</text><text x="105" y="453" class="b">Mental-health screening · environmental exposure mitigation</text><rect x="630" y="365" width="500" height="135" rx="22" fill="#fff7ed" stroke="#fdba74"/><text x="665" y="410" class="h">Long-work / smoking / drinking profile</text><text x="665" y="453" class="b">Rest / working-time support · smoking and alcohol intervention · stress care</text><text x="70" y="600" class="s">These are analytical policy considerations from the project report, not individualized medical recommendations.</text></svg>