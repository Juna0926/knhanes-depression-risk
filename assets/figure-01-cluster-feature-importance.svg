<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:22px;fill:#667085}.h{font-size:25px;font-weight:700}.b{font-size:20px;fill:#475467}</style><text x="70" y="85" class="t">Cluster-Specific Depression Risk Factors</text><text x="70" y="125" class="s">Random Forest feature-importance interpretation after K-Means subgrouping</text><rect x="70" y="190" width="500" height="390" rx="26" fill="#eff6ff" stroke="#93c5fd"/><text x="110" y="250" class="h">Cluster 0 · older / low-energy / chronic disease</text><text x="110" y="310" class="b">• Protein intake</text><text x="110" y="355" class="b">• Cholesterol intake</text><text x="110" y="400" class="b">• Sitting time</text><text x="110" y="445" class="b">• Fat intake</text><text x="110" y="490" class="b">• Vitamin C intake</text><rect x="630" y="190" width="500" height="390" rx="26" fill="#f5f3ff" stroke="#c4b5fd"/><text x="670" y="250" class="h">Cluster 1 · younger / unmarried / sedentary</text><text x="670" y="310" class="b">• Potassium</text><text x="670" y="355" class="b">• Vitamin C</text><text x="670" y="400" class="b">• BMI</text><text x="670" y="445" class="b">• Sodium / vitamin B2</text><text x="670" y="490" class="b">• n-3 fatty acids</text><text x="70" y="630" class="s">The report emphasizes that important factors differ by subgroup; this figure preserves factor names without inventing unreported importance magnitudes.</text></svg>